server {
    listen 80;
    root /app/dist;
    index index.html;

    # Aligné sur la limite d'Express (`express.json`/`express.raw`, 5 Mo). Le
    # défaut nginx est 1 Mo : le conteneur était donc PLUS strict que le
    # backend, et refusait avec un 413 opaque — venu de nginx, jamais de FriRSS
    # — des requêtes que l'application acceptait. Le cas qui fait mal est la
    # restauration de sauvegarde, dont l'enveloppe chiffrée part en un seul
    # JSON : elle échouait au moment précis où l'on s'en sert.
    #
    # Ce n'est pas la seule limite du chemin : un reverse proxy en amont impose
    # la sienne (1 Mo par défaut sur nginx comme sur Nginx Proxy Manager).
    client_max_body_size 5m;

    # API — proxy to Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback + browser-facing security headers on the app document.
    # (nginx serves the HTML directly, so these can't come from the backend.)
    location / {
        try_files $uri $uri/ /index.html;

        # Defence-in-depth on top of DOMPurify: scripts only from our origin
        # (the bundle has no inline <script>). Inline styles are allowed (theme
        # system + React style props) and images may load from any site.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' data: blob: https: http:; connect-src 'self'; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── Service worker : surtout PAS de CSP ─────────────────────────
    #
    # Un service worker hérite de la CSP livrée avec SON PROPRE script, et
    # l'applique à ses `fetch()` internes. Or il intercepte toutes les requêtes
    # d'images (`request.destination === 'image'`, CacheFirst — voir
    # `vite.config.js`) : sous `connect-src 'self'`, il ne peut plus aller
    # chercher une seule image tierce, et TOUTES les images d'articles cassent.
    #
    # Le bloc « static assets » ci-dessous matche `\.js$`, donc `/sw.js` avec.
    # Cette location exacte le devance (nginx : un match exact l'emporte sur une
    # regex) et lui rend les trois autres en-têtes sans la CSP, qui n'a de sens
    # que pour un document — un script n'est pas un contexte de navigation.
    location = /sw.js {
        # Ni `expires 1y` ni `immutable` : ce fichier n'est PAS versionné par un
        # hash, contrairement à tout ce que sert le bloc suivant. C'est le seul
        # point d'entrée par lequel une nouvelle version du worker peut arriver,
        # et le déclarer immuable pendant un an dit exactement le contraire de
        # ce qu'on veut. Les navigateurs revalident le script d'un service
        # worker quoi qu'en dise l'en-tête, donc ça « marchait » — mais reposer
        # sur le fait qu'un client ignore ce qu'on lui répond n'est pas un
        # contrat. `no-cache` autorise la mise en cache ET impose la
        # revalidation : rien n'est retéléchargé sans raison, rien n'est servi
        # périmé.
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Static assets — long cache.
    #
    # The four security headers are REPEATED here on purpose, and the
    # duplication is not an oversight to tidy away. nginx serves each request
    # from exactly ONE location, and a regex location wins over the `/` prefix:
    # every .js/.css/.svg was handled here and NEVER by `location /`, so it went
    # out carrying Cache-Control alone. Hoisting the headers up to `server`
    # would not fix it either — a block that declares any `add_header` of its
    # own inherits none, and this one declares Cache-Control.
    #
    # It matters most for `.svg`: an SVG opened directly is a same-origin
    # document that can carry script, so this is precisely where the CSP and
    # `nosniff` must not go missing. Keep the two lists in step.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' data: blob: https: http:; connect-src 'self'; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
