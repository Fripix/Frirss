server {
    listen 80;
    root /app/dist;
    index index.html;

    # API — proxy to Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback + browser-facing security headers on the app document.
    # (nginx serves the HTML directly, so these can't come from the backend.)
    location / {
        try_files $uri $uri/ /index.html;

        # Defence-in-depth on top of DOMPurify: scripts only from our origin
        # (the bundle has no inline <script>). Inline styles are allowed (theme
        # system + React style props) and images may load from any site.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' data: blob: https: http:; connect-src 'self'; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Static assets — long cache.
    #
    # The four security headers are REPEATED here on purpose, and the
    # duplication is not an oversight to tidy away. nginx serves each request
    # from exactly ONE location, and a regex location wins over the `/` prefix:
    # every .js/.css/.svg was handled here and NEVER by `location /`, so it went
    # out carrying Cache-Control alone. Hoisting the headers up to `server`
    # would not fix it either — a block that declares any `add_header` of its
    # own inherits none, and this one declares Cache-Control.
    #
    # It matters most for `.svg`: an SVG opened directly is a same-origin
    # document that can carry script, so this is precisely where the CSP and
    # `nosniff` must not go missing. Keep the two lists in step.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' data: blob: https: http:; connect-src 'self'; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
