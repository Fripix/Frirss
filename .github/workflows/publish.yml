name: Publish image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Emulation so arm64 (Raspberry Pi) images can be built on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Compute image tags. Always :sha-xxxxxxx. main → :latest (stable),
      # dev → :dev (testing), git tag vX.Y.Z → :X.Y.Z and :X.Y (releases).
      - name: Compute image tags
        id: tags
        run: |
          IMAGE=ghcr.io/fripix/frirss
          TAGS="$IMAGE:sha-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          elif [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            TAGS="$TAGS,$IMAGE:dev"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            TAGS="$TAGS,$IMAGE:$VER,$IMAGE:${VER%.*}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"
          # Multi-arch (adds arm64 / Raspberry Pi) only on stable images —
          # main and release tags. dev stays amd64-only to keep builds fast.
          PLATFORMS="linux/amd64"
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ]]; then
            PLATFORMS="linux/amd64,linux/arm64"
          fi
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "Platforms: $PLATFORMS"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ steps.tags.outputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror latest to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag docker.io/fripix/frirss:latest \
            ghcr.io/fripix/frirss:latest

      - name: Mirror release to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          MINOR="${VER%.*}"

          docker buildx imagetools create \
            --tag docker.io/fripix/frirss:$VER \
            --tag docker.io/fripix/frirss:$MINOR \
            ghcr.io/fripix/frirss:$VER
