name: Publish image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Pour compter les exécutions de ce workflow (numéro de build dev).
      actions: read
    steps:
      # Full history + tags so the dev build label can count commits since the
      # last release tag (see the DEV_VERSION step below).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Emulation so arm64 (Raspberry Pi) images can be built on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Compute image tags. Always :sha-xxxxxxx. main → :latest (stable),
      # dev → :dev (testing), git tag vX.Y.Z → :X.Y.Z and :X.Y (releases).
      - name: Compute image tags
        id: tags
        env:
          # `gh api` (dev build number) authenticates with this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE=ghcr.io/fripix/frirss
          TAGS="$IMAGE:sha-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          elif [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            TAGS="$TAGS,$IMAGE:dev"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            TAGS="$TAGS,$IMAGE:$VER,$IMAGE:${VER%.*}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"
          # Multi-arch (adds arm64 / Raspberry Pi) only on stable images —
          # main and release tags. dev stays amd64-only to keep builds fast.
          PLATFORMS="linux/amd64"
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ]]; then
            PLATFORMS="linux/amd64,linux/arm64"
          fi
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "Platforms: $PLATFORMS"
          # Dev builds carry a beta label "v<version>b<N>" where N is the
          # number of PUSHES to dev since the last release tag, reset each
          # release. Empty on main / release tags.
          #
          # N used to count commits, which inflated it fast — a single working
          # session pushed the last cycle to b73 and the number stopped meaning
          # anything. Git records commits, not pushes; the only thing that maps
          # 1:1 to a push is a run of this very workflow, so that is what we
          # count. Falls back to the commit count if the API is unavailable, so
          # a build never fails over a build label.
          DEV_VERSION=""
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            LAST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '')"
            # Cutoff = when the tag was CUT, not when its commit was authored.
            # The push that delivered that commit predates the release and must
            # not count, or every cycle would start at b2.
            SINCE_TS=0
            if [[ -n "$LAST_TAG" ]]; then
              SINCE_TS="$(git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$LAST_TAG")"
              [[ -z "$SINCE_TS" ]] && SINCE_TS="$(git log -1 --format=%ct "$LAST_TAG")"
            fi
            # Compare as numbers. Dates were compared as strings once and every
            # run was silently excluded: git prints "+02:00" offsets and GitHub
            # prints "Z", so "09:40Z" sorted below "10:51+02:00".
            N="$(gh api --paginate \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?branch=dev&event=push&per_page=100" \
                  --jq "[.workflow_runs[] | select((.created_at | fromdateiso8601) > $SINCE_TS)] | length" \
                 2>/dev/null | awk '{s+=$1} END {print s+0}')"
            if [[ -z "$N" || "$N" == "0" ]]; then
              RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
              N="$(git rev-list --count --no-merges --first-parent $RANGE)"
              echo "Run-count unavailable, fell back to the commit count."
            fi
            DEV_VERSION="v$(node -p "require('./package.json').version")b${N}"
          fi
          echo "dev_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Dev version: $DEV_VERSION"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ steps.tags.outputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            FRIRSS_DEV_VERSION=${{ steps.tags.outputs.dev_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror latest to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag docker.io/fripix/frirss:latest \
            ghcr.io/fripix/frirss:latest

      - name: Mirror release to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          MINOR="${VER%.*}"

          docker buildx imagetools create \
            --tag docker.io/fripix/frirss:$VER \
            --tag docker.io/fripix/frirss:$MINOR \
            ghcr.io/fripix/frirss:$VER
