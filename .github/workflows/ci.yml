name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard rail: fail the build if any personal infra reference (private
      # domain / internal IP range) ever sneaks into a tracked file.
      - name: Leak guard
        run: |
          if git grep -nI -e 'fri[h]ub' -e '10\.[3]\.0\.[0-9]' -- . ':(exclude).github/workflows/*' ':(exclude)package-lock.json'; then
            echo "::error::Personal infra reference found above — scrub it before committing."
            exit 1
          fi
          echo "Leak guard: clean"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t frirss:ci .

      # A pre-existing data directory owned by root is the realistic upgrade
      # case: every install created before the container dropped privileges has
      # one. The entrypoint must adopt it, not fail on it.
      - name: Prepare a root-owned data directory (upgrade path)
        run: |
          sudo mkdir -p /tmp/frirss-data
          sudo chown 0:0 /tmp/frirss-data

      - name: Run container
        run: docker run -d --name frirss -p 8080:80 -v /tmp/frirss-data:/app/data frirss:ci

      - name: Smoke-test /api/health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "health check failed"; docker logs frirss; exit 1

      # The application processes must not be root. Before this was enforced,
      # any code execution inside Node owned the container — including the
      # SQLite database that holds the JWT secret and the token-encryption key.
      - name: Assert nginx and node do not run as root
        run: |
          ps_out=$(docker exec frirss ps -o user,comm)
          echo "$ps_out"
          if echo "$ps_out" | awk 'NR>1 && ($2 ~ /nginx|node/) && ($1 == "root" || $1 == "0")' | grep -q .; then
            echo "::error::a privileged nginx/node process is still running as root"
            exit 1
          fi
          echo "no root-owned application process"

      - name: Stop container
        if: always()
        run: docker rm -f frirss || true
