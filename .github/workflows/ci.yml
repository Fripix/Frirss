name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard rail: fail the build if any personal infra reference (private
      # domain / internal IP range) ever sneaks into a tracked file.
      - name: Leak guard
        run: |
          if git grep -nI -e 'fri[h]ub' -e '10\.[3]\.0\.[0-9]' -- . ':(exclude).github/workflows/*' ':(exclude)package-lock.json'; then
            echo "::error::Personal infra reference found above — scrub it before committing."
            exit 1
          fi
          echo "Leak guard: clean"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t frirss:ci .

      # A pre-existing data directory owned by root is the realistic upgrade
      # case: every install created before the container dropped privileges has
      # one. The entrypoint must adopt it, not fail on it.
      - name: Prepare a root-owned data directory (upgrade path)
        run: |
          sudo mkdir -p /tmp/frirss-data
          sudo chown 0:0 /tmp/frirss-data

      - name: Run container
        run: docker run -d --name frirss -p 8080:80 -v /tmp/frirss-data:/app/data frirss:ci

      - name: Smoke-test /api/health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "health check failed"; docker logs frirss; exit 1

      # Node must not be root: it runs the application code, parses untrusted
      # content and owns the SQLite database that holds the JWT secret and the
      # token-encryption key. nginx keeps its standard split — a root master
      # that binds :80, unprivileged workers that handle request data — because
      # making the master unprivileged needs a file capability that
      # `no-new-privileges` and `cap_drop: ALL` refuse, and this image must not
      # break where it used to work.
      #
      # The check matches on the USER column, never on a command name: busybox
      # ps reports Node as "MainThread", so a first version keyed on
      # /nginx|node/ silently skipped the very process it existed for.
      - name: Assert only the nginx master runs as root
        run: |
          ps_out=$(docker exec frirss ps -o user,pid,args)
          echo "$ps_out"
          if [ "$(echo "$ps_out" | awk '$2 == 1 {print $1}')" = "root" ]; then
            echo "::error::PID 1 (Node) is root"
            exit 1
          fi
          if echo "$ps_out" | awk '$1 == "root" && /worker process/' | grep -q .; then
            echo "::error::an nginx worker is running as root"
            exit 1
          fi
          if echo "$ps_out" | awk 'NR>1 && $1 == "root" && !/master process/ && $3 != "ps"' | grep -q .; then
            echo "::error::an unexpected root process is running"
            exit 1
          fi
          echo "only the nginx master is root"

      # Le service worker ne doit JAMAIS recevoir de CSP : il l'applique à ses
      # propres fetch(), et il intercepte toutes les images d'articles. Une CSP
      # avec `connect-src 'self'` sur /sw.js casse silencieusement TOUTES les
      # images tierces de l'application — c'est arrivé, en ajoutant les en-têtes
      # de sécurité au bloc des fichiers statiques, qui matche aussi `.js`.
      - name: Assert the service worker carries no CSP, the document does
        run: |
          sw=$(curl -fsSI http://localhost:8080/sw.js)
          echo "$sw"
          if echo "$sw" | grep -qi '^content-security-policy'; then
            echo "::error::/sw.js is served with a CSP — cross-origin images will break"
            exit 1
          fi
          if ! echo "$sw" | grep -qi '^x-content-type-options'; then
            echo "::error::/sw.js lost its other security headers"
            exit 1
          fi
          # Le script du worker n'est pas versionné par un hash : le déclarer
          # immuable ferme le seul chemin par lequel une mise à jour arrive.
          if echo "$sw" | grep -i '^cache-control' | grep -qi 'immutable'; then
            echo "::error::/sw.js is served as immutable — updates cannot reach clients"
            exit 1
          fi
          doc=$(curl -fsSI http://localhost:8080/)
          if ! echo "$doc" | grep -qi '^content-security-policy'; then
            echo "::error::the app document lost its CSP"
            exit 1
          fi
          asset=$(curl -fsSI "http://localhost:8080/$(docker exec frirss sh -c 'ls /app/dist/assets/index-*.js | head -1' | sed 's#/app/dist/##')")
          if ! echo "$asset" | grep -qi '^content-security-policy'; then
            echo "::error::static assets lost their CSP"
            exit 1
          fi
          echo "sw without CSP nor immutable, document and assets with CSP"

      # `mime.types` n'a pas d'entrée `webmanifest` : sans la location exacte de
      # nginx.conf, le manifeste partait en application/octet-stream.
      - name: Assert the web app manifest has its media type
        run: |
          ctype=$(curl -fsSI http://localhost:8080/manifest.webmanifest | grep -i '^content-type' | tr -d '\r')
          echo "$ctype"
          if ! echo "$ctype" | grep -qi 'application/manifest+json'; then
            echo "::error::manifest.webmanifest is not served as application/manifest+json"
            exit 1
          fi

      # Le repli SPA ne vaut que pour les routes de l'application (sans
      # extension). Un fichier absent doit répondre 404, pas l'application en
      # 200 : `/.env` et `/.git/HEAD` « existaient » pour tout scanner.
      - name: Assert missing files answer 404, app routes still the document
        run: |
          for path in /.env /.git/HEAD /x.js.map /missing.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            if [ "$code" != "404" ]; then
              echo "::error::$path answered $code instead of 404 (SPA fallback too wide)"
              exit 1
            fi
            # Ce 404 est rendu par `@spa` lui-même : il partait sans en-têtes.
            hdrs=$(curl -sSI "http://localhost:8080$path")
            for h in content-security-policy x-content-type-options x-frame-options referrer-policy; do
              if ! echo "$hdrs" | grep -qi "^$h:"; then
                echo "::error::the 404 for $path is missing $h"
                exit 1
              fi
            done
          done
          for path in / /some/app/route; do
            hdrs=$(curl -sSI "http://localhost:8080$path")
            if ! echo "$hdrs" | head -1 | grep -q ' 200'; then
              echo "::error::$path no longer serves the app"
              exit 1
            fi
            if ! echo "$hdrs" | grep -qi '^content-security-policy'; then
              echo "::error::$path lost its CSP through the SPA fallback"
              exit 1
            fi
          done
          echo "missing files 404 with security headers, app routes 200 with CSP"

      # Le conteneur ne doit pas être plus strict que le backend qu'il sert.
      # Avec le défaut nginx (1 Mo), une requête de 2 Mo mourait sur un 413
      # émis par nginx, alors qu'Express en accepte 5 — c'est la restauration
      # de sauvegarde qui en pâtissait. Un corps non authentifié doit atteindre
      # Express et se voir refuser pour ce qu'il est : un 401, jamais un 413.
      - name: Assert a 2 MB body reaches the backend
        run: |
          code=$(head -c 2097152 /dev/zero | curl -s -o /dev/null -w '%{http_code}' \
            -X POST --data-binary @- \
            -H 'Content-Type: application/octet-stream' \
            -H 'X-Proxy-Target: https://example.com/' \
            http://localhost:8080/api/proxy)
          echo "2 MB unauthenticated POST → $code"
          if [ "$code" = "413" ]; then
            echo "::error::nginx rejects a 2 MB body the backend would accept (client_max_body_size)"
            exit 1
          fi
          if [ "$code" != "401" ]; then
            echo "::error::expected 401 from the backend, got $code"
            exit 1
          fi

      # FRIRSS_PORT (#33) : en réseau « host », `-p` ne s'applique pas et nginx
      # doit écouter là où on le lui dit. Le contrôle de santé de l'image doit
      # suivre (il interrogeait :80 en dur), une variable PORT ne doit pas
      # déplacer Node hors de 3001, et une valeur invalide doit arrêter le
      # démarrage au lieu de retomber sur 80 sans rien dire.
      - name: Assert FRIRSS_PORT moves nginx and its health check
        run: |
          docker run -d --name frirss-port --network host \
            -e FRIRSS_PORT=8089 -e PORT=8090 frirss:ci
          ok=no
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' frirss-port)
            if [ "$status" = "healthy" ] && curl -fsS http://127.0.0.1:8089/api/health | grep -q '"status":"ok"'; then
              ok=yes; break
            fi
            sleep 3
          done
          if [ "$ok" != yes ]; then
            echo "::error::container on FRIRSS_PORT=8089 is not healthy (status: $status)"
            docker logs frirss-port; exit 1
          fi
          if curl -fsS -o /dev/null http://127.0.0.1:80/ 2>/dev/null; then
            echo "::error::nginx still answers on 80 with FRIRSS_PORT=8089"
            exit 1
          fi
          # M2 : seul nginx joint Node. Depuis l'adresse réseau de la machine,
          # nginx répond et le 3001 refuse ; sinon les limites par IP de
          # connexion se contournent en parlant à Node sans nginx.
          ip=$(hostname -I | awk '{print $1}')
          if ! curl -fsS -m 5 "http://$ip:8089/api/health" | grep -q '"status":"ok"'; then
            echo "::error::nginx does not answer on $ip:8089"
            exit 1
          fi
          if curl -sS -m 5 -o /dev/null "http://$ip:3001/api/health" 2>/dev/null; then
            echo "::error::the backend answers on $ip:3001 without nginx"
            exit 1
          fi
          docker rm -f frirss-port
          for bad in abc 0 70000 3001; do
            if docker run --rm -e FRIRSS_PORT=$bad frirss:ci >/tmp/port.log 2>&1; then
              echo "::error::FRIRSS_PORT=$bad was accepted"
              exit 1
            fi
            grep -q 'FRIRSS_PORT' /tmp/port.log || { echo "::error::no message for FRIRSS_PORT=$bad"; cat /tmp/port.log; exit 1; }
          done
          echo "FRIRSS_PORT moves nginx and the health check, PORT cannot move Node, Node is not reachable without nginx, bad values stop the start"

      - name: Stop container
        if: always()
        run: docker rm -f frirss frirss-port || true
