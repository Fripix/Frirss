name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard rail: fail the build if any personal infra reference (private
      # domain / internal IP range) ever sneaks into a tracked file.
      - name: Leak guard
        run: |
          if git grep -nI -e 'fri[h]ub' -e '10\.[3]\.0\.[0-9]' -- . ':(exclude).github/workflows/*' ':(exclude)package-lock.json'; then
            echo "::error::Personal infra reference found above — scrub it before committing."
            exit 1
          fi
          echo "Leak guard: clean"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t frirss:ci .

      # A pre-existing data directory owned by root is the realistic upgrade
      # case: every install created before the container dropped privileges has
      # one. The entrypoint must adopt it, not fail on it.
      - name: Prepare a root-owned data directory (upgrade path)
        run: |
          sudo mkdir -p /tmp/frirss-data
          sudo chown 0:0 /tmp/frirss-data

      - name: Run container
        run: docker run -d --name frirss -p 8080:80 -v /tmp/frirss-data:/app/data frirss:ci

      - name: Smoke-test /api/health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "health check failed"; docker logs frirss; exit 1

      # Node must not be root: it runs the application code, parses untrusted
      # content and owns the SQLite database that holds the JWT secret and the
      # token-encryption key. nginx keeps its standard split — a root master
      # that binds :80, unprivileged workers that handle request data — because
      # making the master unprivileged needs a file capability that
      # `no-new-privileges` and `cap_drop: ALL` refuse, and this image must not
      # break where it used to work.
      #
      # The check matches on the USER column, never on a command name: busybox
      # ps reports Node as "MainThread", so a first version keyed on
      # /nginx|node/ silently skipped the very process it existed for.
      - name: Assert only the nginx master runs as root
        run: |
          ps_out=$(docker exec frirss ps -o user,pid,args)
          echo "$ps_out"
          if [ "$(echo "$ps_out" | awk '$2 == 1 {print $1}')" = "root" ]; then
            echo "::error::PID 1 (Node) is root"
            exit 1
          fi
          if echo "$ps_out" | awk '$1 == "root" && /worker process/' | grep -q .; then
            echo "::error::an nginx worker is running as root"
            exit 1
          fi
          if echo "$ps_out" | awk 'NR>1 && $1 == "root" && !/master process/ && $3 != "ps"' | grep -q .; then
            echo "::error::an unexpected root process is running"
            exit 1
          fi
          echo "only the nginx master is root"

      - name: Stop container
        if: always()
        run: docker rm -f frirss || true
